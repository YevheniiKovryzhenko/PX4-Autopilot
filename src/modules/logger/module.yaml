module_name: logger
parameters:
- group: SIM Control Logger
  definitions:
    SM_LOG:
            description:
                short: Choose which Simulink topics to log
                long: |
                    Select the types of uORB messages to log.
            type: bitmask
            bit:
                0: sim_control_status
                1: simulink_inbound
                2: simulink_outbound
                3: companion_guidance_inbound
                4: companion_guidance_outbound
                5: sim_guidance_request
                6: sim_guidance_status
                7: simulink_guidance
                8: sim_guidance_trajectory
            default: 511
            reboot_required: true

    SM_INBD_LOG_T:
            description:
                short: simulink_inbound topics logging delay
                long: |
                    This parameter controls the frequency of logging for
                    all simulink_inbound topics. The value is the delay
                    in milliseconds.
            type: int32
            unit: ms
            min: 0
            max: 10000
            reboot_required: true
            default: 20

    SM_OUTBD_LOG_T:
            description:
                short: simulink_outbound topics logging delay
                long: |
                    This parameter controls the frequency of logging for
                    all simulink_outbound topics. The value is the delay
                    in milliseconds.
            type: int32
            unit: ms
            min: 0
            max: 10000
            reboot_required: true
            default: 20

    SM_CTRLST_LOG_T:
            description:
                short: sim_control_status topic logging delay
                long: |
                    This parameter controls the frequency of logging for the
                    sim_control_status topic. The value is the delay
                    in milliseconds.
            type: int32
            unit: ms
            min: 0
            max: 10000
            reboot_required: true
            default: 20

