module_name: Simulink Parameters
parameters:
- group: SIM Parameter Re-Defines
  definitions:
    FW_THR_MAX:
      description:
        short: Throttle limit max
        long: Applies in any altitude controlled flight mode. Should be set accordingly to achieve FW_T_CLMB_MAX.
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
      unit: norm
    FW_THR_MIN:
      description:
        short: Throttle limit min
        long: Applies in any altitude controlled flight mode. Usually set to 0 but can be increased to prevent the motor from
          stopping when descending, which can increase achievable descent rates.
      type: float
      default: 0.0
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
      unit: norm
    FW_T_CLMB_R_SP:
      description:
        short: Default target climbrate
        long: 'In auto modes: default climb rate output by controller to achieve altitude setpoints. In manual modes: maximum
          climb rate setpoint.'
      type: float
      default: 3.0
      min: 0.5
      max: 15.0
      increment: 0.01
      decimal: 2
      unit: m/s
    FW_T_SINK_R_SP:
      description:
        short: Default target sinkrate
        long: 'In auto modes: default sink rate output by controller to achieve altitude setpoints. In manual modes: maximum
          sink rate setpoint.'
      type: float
      default: 2.0
      min: 0.5
      max: 15.0
      increment: 0.01
      decimal: 2
      unit: m/s
    FW_LND_ANG:
      description:
        short: Maximum landing slope angle
        long: Typically the desired landing slope angle when landing configuration (flaps, airspeed) is enabled. Set this
          value within the vehicle's performance limits.
      type: float
      default: 5.0
      min: 1.0
      max: 15.0
      increment: 0.5
      decimal: 1
      unit: deg
