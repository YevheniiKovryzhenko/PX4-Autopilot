module_name: Simulink Parameters
parameters:
- group: SIM Parameter Re-Defines
  definitions:
    FW_MAN_P_SC:
      description:
        short: Manual pitch scale
        long: Scale factor applied to the desired pitch actuator command in full manual mode. This parameter allows to adjust
          the throws of the control surfaces.
      type: float
      default: 1.0
      min: 0.0
      increment: 0.01
      decimal: 2
      unit: norm
    FW_MAN_R_SC:
      description:
        short: Manual roll scale
        long: Scale factor applied to the desired roll actuator command in full manual mode. This parameter allows to adjust
          the throws of the control surfaces.
      type: float
      default: 1.0
      min: 0.0
      max: 1.0
      increment: 0.01
      decimal: 2
      unit: norm
    FW_MAN_Y_SC:
      description:
        short: Manual yaw scale
        long: Scale factor applied to the desired yaw actuator command in full manual mode. This parameter allows to adjust
          the throws of the control surfaces.
      type: float
      default: 1.0
      min: 0.0
      increment: 0.01
      decimal: 2
      unit: norm
