module_name: Simulink Parameters

parameters:
    - group: SENSOR PARAMS
      definitions:
        SM_LIDAR_H1:
            description:
                short: LiDAR blend start altitude (ft)
                long: |
                    LiDAR blend start altitude (ft)

            type: float
            decimal: 2
            default: 5

        SM_LIDAR_H2:
            description:
                short: LiDAR blend end altitude (ft)
                long: |
                    LiDAR blend end altitude (ft)

            type: float
            decimal: 2
            default: 20

        SM_LIDAR_HMODE:
            description:
                short: Altitude source selection
                long: |
                    Altitude source selection

            type: enum
            values:
              0: Pixhawk
              1: LiDAR
              2: Blended
            default: 2

        SM_LIDAR_VVMODE:
            description:
                short: VV source selection
                long: |
                    VV source selection

            type: enum
            values:
              0: Pixhawk
              1: LiDAR
              2: Blended
            default: 2

        SM_LIDAR_TAU:
            description:
                short: LIDAR HMODE gain
                long: |
                    SIMULINK sensor parameter values

            type: float
            decimal: 2
            default: 0.3

        SM_HDG_OFFSET:
            description:
                short: HDG correction offset (deg)
                long: |
                    HDG correction offset (deg)

            type: float
            decimal: 2
            default: 0

        SM_SPD_MODE:
            description:
                short: Velocity source selection
                long: |
                    Velocity source selection

            type: enum
            values:
              0: Ground Speed
              1: Blended (VFWD)
              2: Blended (KEAS)
            default: 2

        SM_SPD_V1:
            description:
                short: Speed source blending start speed (kts)
                long: |
                    Speed source blending start speed (kts)

            type: float
            decimal: 2
            default: 12

        SM_SPD_V2:
            description:
                short: Speed source blending end speed (kts)
                long: |
                    Speed source blending end speed (kts)

            type: float
            decimal: 2
            default: 16

        SM_VV_SOURCE:
            description:
                short: VV sensor source selector
                long: |
                    VV sensor source selector

            type: enum
            values:
              0: Veh Loc Posn (vz)
              1: Manual Deriv (zdot)
              2: Veh Odometry (vz)
            default: 0

        SM_VEL_SOURCE:
            description:
                short: Ground velocity (vx,vy) sensor source selector
                long: |
                    Ground velocity (vx,vy) sensor source selector

            type: enum
            values:
              1: Raw GPS Data
              2: Veh Loc Posn
            default: 1

        SM_GPS_SOURCE:
            description:
                short: Vehicle GPS coordinates (Lat,Long) sensor source selector
                long: |
                    Vehicle GPS coordinates (Lat,Long) sensor source selector

            type: enum
            values:
              1: Raw GPS Data
              2: Estimator GPS Data
            default: 1

        SM_VV_MAX:
            description:
                short: Maximum allowable VV (m/s) the FCS can see
                long: |
                    Maximum allowable VV (m/s) the FCS can see

            type: float
            decimal: 2
            default: 3

        SM_VLAT_MAX:
            description:
                short: Maximum allowable VLAT (m/s) the FCS can see
                long: |
                    Maximum allowable VLAT (m/s) the FCS can see

            type: float
            decimal: 2
            default: 5

        SM_V_MIN:
            description:
                short: Minimum allowable speed (kts) the FCS can see
                long: |
                    Minimum allowable speed (kts) the FCS can see

            type: float
            decimal: 2
            default: -5

        SM_GC_SOURCE:
            description:
                short: Ground contact source selector
                long: |
                    Ground contact source selector

            type: enum
            values:
              0: LiDAR
              1: Forced ON
              2: Forced OFF
            default: 0
